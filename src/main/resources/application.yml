spring:
  application:
    name: staff-attendance
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:attendance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: INFO
    com.edifies.attendance: DEBUG
    org.flywaydb: INFO

attendance:
  timezone: ${ATTENDANCE_TIMEZONE:Asia/Kolkata}
  cutoff-hour: ${ATTENDANCE_CUTOFF_HOUR:4}
  photo:
    storage-root: ${PHOTO_STORAGE_ROOT:photos}
    max-file-size: 2097152
    retention-days: ${PHOTO_RETENTION_DAYS:90}
  backup:
    enabled: ${BACKUP_ENABLED:true}
    storage-root: ${BACKUP_STORAGE_ROOT:backups}
    cron: ${BACKUP_CRON:0 0 1 * * ?}
    pg-bin-dir: ${PG_BIN_DIR:C:\Program Files\PostgreSQL\17\bin}
    encryption-enabled: ${BACKUP_ENCRYPTION_ENABLED:false}
    encryption-key: ${BACKUP_ENCRYPTION_KEY:}
    rpo-target-hours: ${BACKUP_RPO_HOURS:24}
    rto-target-minutes: ${BACKUP_RTO_MINUTES:5}
    retention:
      keep-daily: ${BACKUP_RETENTION_DAILY:7}
      keep-weekly: ${BACKUP_RETENTION_WEEKLY:4}
      keep-monthly: ${BACKUP_RETENTION_MONTHLY:3}

app:
  kiosk:
    device-enforcement-enabled: ${DEVICE_ENFORCEMENT_ENABLED:true}



