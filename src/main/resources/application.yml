spring:
  application:
    name: staff-attendance
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:attendance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.edifies.attendance: DEBUG
    org.flywaydb: INFO

attendance:
  timezone: ${ATTENDANCE_TIMEZONE:Asia/Kolkata}
  cutoff-hour: ${ATTENDANCE_CUTOFF_HOUR:4}
  photo:
    storage-root: ${PHOTO_STORAGE_ROOT:photos}
    max-file-size: 2097152
    retention-days: ${PHOTO_RETENTION_DAYS:90}

app:
  kiosk:
    device-enforcement-enabled: ${DEVICE_ENFORCEMENT_ENABLED:true}


