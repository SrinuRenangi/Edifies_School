services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
    networks:
      - attendance_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-attendance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance_net
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-attendance}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      PHOTO_STORAGE_ROOT: /app/photos
      BACKUP_STORAGE_ROOT: /app/backups
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:4200,http://127.0.0.1:8080}
      ATTENDANCE_TIMEZONE: ${ATTENDANCE_TIMEZONE:-Asia/Kolkata}
    volumes:
      - attendance_photos:/app/photos
      - attendance_backups:/app/backups
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

networks:
  attendance_net:
    driver: bridge
    name: attendance_network

volumes:
  postgres_data:
    name: attendance_postgres_data
  attendance_photos:
    name: attendance_photos_data
  attendance_backups:
    name: attendance_backups_data

